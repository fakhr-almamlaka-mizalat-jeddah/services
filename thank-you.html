<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم استلام طلبك بنجاح | مؤسسة فخر المملكة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #f8f9fa; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
        .card { background: #fff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 500px; width: 100%; border-top: 5px solid #28a745; }
        .icon { font-size: 60px; color: #28a745; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 15px; }
        p { font-size: 16px; color: #666; line-height: 1.6; margin-bottom: 25px; }
        .btn { display: inline-block; background-color: #007bff; color: #fff; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background-color: #0056b3; }
        .footer-note { margin-top: 20px; font-size: 13px; color: #999; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">✓</div>
        <h1>شكراً لك! تم استلام طلبك بنجاح</h1>
        <p>لقد تلقينا بيانات اتصالك بخصوص خدمات المظلات والسواتر في جدة ومكة. سيتواصل معك فريق المختصين لدينا في أقرب وقت لتأكيد التفاصيل وتقديم أفضل خدمة.</p>
        <a href="index.html" class="btn">العودة إلى الرئيسية</a>
        <div class="footer-note">مؤسسة فخر المملكة للمظلات والسواتر</div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم فخر المملكة — الإعلانات والباقات</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/style.css">
</head>
<body style="background:var(--sand)">

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <span>فخر المملكة — لوحة التحكم</span>
    </a>
  </div>
</header>

<div class="admin-wrap">

  <!-- ===== شاشة الدخول ===== -->
  <div class="admin-card" id="loginCard">
    <h2>تسجيل الدخول</h2>
    <label>كلمة المرور</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button class="btn btn-primary" onclick="doLogin()">دخول</button>
    <p class="admin-status" id="loginStatus"></p>
  </div>

  <!-- ===== لوحة التحرير (تظهر بعد الدخول فقط) ===== -->
  <div class="admin-card" id="editorCard" style="display:none">
    <h2>إدارة الإعلانات والباقات</h2>
    <p style="font-size:.85rem;color:#57524a">أضف أو عدّل أو احذف أي بطاقة إعلان/باقة، ثم اضغط "حفظ الكل" — التغييرات تظهر لكل زوار الموقع خلال دقيقة (تحديث كل 60 ثانية، وليس فورياً).</p>

    <div id="itemsContainer"></div>
    <button class="btn btn-ghost" style="border-color:var(--brass);color:var(--clay)" onclick="addItem()">+ إضافة بطاقة جديدة</button>
    <br><br>
    <button class="btn btn-primary" onclick="saveItems()">حفظ الكل</button>
    <button class="btn btn-ghost" onclick="doLogout()" style="margin-inline-start:10px">تسجيل الخروج</button>
    <p class="admin-status" id="saveStatus"></p>
  </div>

</div>

<script>
// ⚠ نفس رابط reviews.js و ads-board.js بالضبط — عدّله بعد نشر الـ Worker
var API_BASE = "https://mizalat-fakhr-almamlaka-jeddah-services-api.alsiyadamazallatjeddah.workers.dev";

var loginCard = document.getElementById('loginCard');
var editorCard = document.getElementById('editorCard');
var itemsContainer = document.getElementById('itemsContainer');
var currentItems = [];

function getToken(){ try{ return localStorage.getItem('adminToken'); }catch(e){ return null; } }
function setToken(t){ try{ localStorage.setItem('adminToken', t); }catch(e){} }
function clearToken(){ try{ localStorage.removeItem('adminToken'); }catch(e){} }
function authHeaders(){
  var t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

function doLogin(){
  var pass = document.getElementById('loginPassword').value;
  var status = document.getElementById('loginStatus');
  status.textContent = 'جارٍ التحقق...';
  status.className = 'admin-status';

  fetch(API_BASE + '/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass })
  })
  .then(function(res){ return res.json().then(function(data){ return {ok: res.ok, data: data}; }); })
  .then(function(result){
    if(!result.ok){
      status.textContent = (result.data && result.data.message) || 'بيانات الدخول غير صحيحة.';
      status.className = 'admin-status err';
      return;
    }
    setToken(result.data.token);
    showEditor();
  })
  .catch(function(err){
    status.textContent = 'تعذر الاتصال بالخادم — تأكد من رابط API_BASE في الصفحة.';
    status.className = 'admin-status err';
    console.warn(err);
  });
}

function doLogout(){
  clearToken();
  loginCard.style.display = '';
  editorCard.style.display = 'none';
}

function showEditor(){
  loginCard.style.display = 'none';
  editorCard.style.display = '';
  loadItems();
}

if (getToken()) { showEditor(); }

function loadItems(){
  fetch(API_BASE + '/api/ads/all', { headers: authHeaders() })
    .then(function(res){
      if(res.status === 401){ doLogout(); throw new Error('unauthorized'); }
      return res.json();
    })
    .then(function(data){
      currentItems = (data.ads || []).map(function(a){
        return {
          id: a.id, badge: a.badge || '', title: a.title || '', desc: a.desc || '',
          price: a.price || '', image: a.image || '', active: a.active !== 0,
          expiresAt: a.expires_at || '', order: a.sort_order
        };
      });
      renderEditor();
    })
    .catch(function(err){ console.warn('loadItems error:', err); });
}

function renderEditor(){
  itemsContainer.innerHTML = '';
  currentItems.forEach(function(item, idx){
    var div = document.createElement('div');
    div.className = 'admin-item';
    div.innerHTML =
      '<button class="remove-item" onclick="removeItem(' + idx + ')">حذف البطاقة ×</button>' +
      '<label>شارة صغيرة (اختياري، مثال: عرض محدود)</label>' +
      '<input data-idx="' + idx + '" data-field="badge" value="' + escapeHTML(item.badge) + '">' +
      '<label>رابط الصورة (اختياري، مثال: صور/shades1.jpg)</label>' +
      '<input data-idx="' + idx + '" data-field="image" value="' + escapeHTML(item.image) + '">' +
      '<label>العنوان</label>' +
      '<input data-idx="' + idx + '" data-field="title" value="' + escapeHTML(item.title) + '">' +
      '<label>الوصف</label>' +
      '<textarea data-idx="' + idx + '" data-field="desc" rows="2">' + escapeHTML(item.desc) + '</textarea>' +
      '<label>السعر / التفاصيل (اختياري)</label>' +
      '<input data-idx="' + idx + '" data-field="price" value="' + escapeHTML(item.price) + '">' +
      '<label>ترتيب الظهور (اختياري — رقم أصغر يظهر أولاً، مثال: 1، 2، 3)</label>' +
      '<input data-idx="' + idx + '" data-field="order" type="number" value="' + (typeof item.order === 'number' ? item.order : '') + '">' +
      '<label>تاريخ انتهاء العرض تلقائياً (اختياري — يختفي الإعلان وحده بعد هذا التاريخ)</label>' +
      '<input data-idx="' + idx + '" data-field="expiresAt" type="date" value="' + escapeHTML(item.expiresAt) + '">' +
      '<div class="admin-toggle"><input type="checkbox" data-idx="' + idx + '" data-field="active" ' + (item.active !== false ? 'checked' : '') + '> <span>مفعّل (يظهر للزوار)</span></div>';
    itemsContainer.appendChild(div);
  });
  itemsContainer.querySelectorAll('input,textarea').forEach(function(el){
    var evt = (el.type === 'checkbox') ? 'change' : 'input';
    el.addEventListener(evt, function(){
      var idx = parseInt(el.dataset.idx, 10);
      var field = el.dataset.field;
      if(field === 'active'){
        currentItems[idx][field] = el.checked;
      } else if(field === 'order'){
        currentItems[idx][field] = el.value === '' ? undefined : parseInt(el.value, 10);
      } else {
        currentItems[idx][field] = el.value;
      }
    });
  });
}

function escapeHTML(v){
  return String(v || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function addItem(){
  currentItems.push({ badge:'', title:'', desc:'', price:'', image:'', active:true, expiresAt:'', order:undefined });
  renderEditor();
}
function removeItem(idx){
  currentItems.splice(idx, 1);
  renderEditor();
}

function saveItems(){
  var status = document.getElementById('saveStatus');

  currentItems = currentItems.map(function(item){
    return {
      id: item.id,
      badge: (item.badge || '').trim(),
      title: (item.title || '').trim(),
      desc: (item.desc || '').trim(),
      price: (item.price || '').trim(),
      image: (item.image || '').trim(),
      active: item.active !== false,
      expiresAt: (item.expiresAt || '').trim(),
      order: item.order
    };
  });

  var missingTitle = currentItems.some(function(item){ return !item.title; });
  if(missingTitle){
    status.textContent = 'كل بطاقة لازم يكون لها عنوان قبل الحفظ.';
    status.className = 'admin-status err';
    return;
  }

  status.textContent = 'جارٍ الحفظ...';
  status.className = 'admin-status';

  fetch(API_BASE + '/api/ads', {
    method: 'PUT',
    headers: authHeaders(),
    body: JSON.stringify({ items: currentItems })
  })
  .then(function(res){
    if(res.status === 401){ doLogout(); throw new Error('unauthorized'); }
    return res.json().then(function(data){ return {ok: res.ok, data: data}; });
  })
  .then(function(result){
    if(!result.ok){
      status.textContent = (result.data && result.data.message) || 'حدث خطأ أثناء الحفظ.';
      status.className = 'admin-status err';
      return;
    }
    status.textContent = 'تم الحفظ بنجاح — التغييرات تظهر لكل الزوار خلال دقيقة.';
    status.className = 'admin-status ok';
    loadItems();
  })
  .catch(function(err){
    status.textContent = 'تعذر الاتصال بالخادم أثناء الحفظ.';
    status.className = 'admin-status err';
    console.warn(err);
  });
}
</script>

</body>
</html>
